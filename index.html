<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নজরুল একাডেমি রিইউনিয়ন ২০২৬ | ফটো ফ্রেম</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eef4f0;color:#12362a;font-family:'Hind Siliguri',sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}h1{font-size:clamp(22px,3vw,36px);margin:0 0 5px}p{margin:0 0 20px;color:#53645b}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 24px #153c2920}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;border:1px solid #b6c9bf;border-radius:9px;padding:11px;font:inherit}input[type=file]{padding:8px}button{width:100%;background:#075333;color:white;border:0;border-radius:10px;font:700 17px 'Hind Siliguri',sans-serif;padding:13px;margin-top:22px;cursor:pointer}button:hover{background:#08794b}.preview{text-align:center}.preview canvas{display:block;width:min(100%,640px);height:auto;margin:auto;box-shadow:0 8px 30px #0002;border-radius:10px}.hint{font-size:13px;margin-top:12px;color:#65736b}@media(max-width:780px){.layout{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}}</style></head><body><main class="wrap"><h1>নজরুল একাডেমি রিইউনিয়ন ২০২৬</h1><p>আপনার ছবি, নাম ও ব্যাচ দিয়ে ব্যক্তিগত ফটো কার্ড তৈরি করুন।</p><div class="layout"><section class="panel"><label for="photo">আপনার ছবি</label><input id="photo" type="file" accept="image/*"><label for="personName">নাম</label><input id="personName" maxlength="55" placeholder="আপনার নাম লিখুন"><label for="batch">ব্যাচ</label><input id="batch" maxlength="18" placeholder="যেমন: ২০১২"><button id="download">ফটো কার্ড ডাউনলোড করুন</button><div class="hint">ছবি ও নাম আপনার ডিভাইসেই প্রসেস হয়; সার্ভারে আপলোড হয় না।</div></section><section class="preview"><canvas id="card" width="1200" height="1200" aria-label="ফটো কার্ড প্রিভিউ"></canvas><p class="hint">প্রিভিউ পরিবর্তনের সঙ্গে সঙ্গে আপডেট হবে।</p></section></div></main><script src="script.js"></script></body></html>
